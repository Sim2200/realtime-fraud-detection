# Cloud Build: build the pipeline/serving image, push it, compile the pipeline and stage the spec in GCS.
#   gcloud builds submit --config vertex/cloudbuild.yaml --project <id> .
steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, vertex/Dockerfile, -t, "${_IMAGE}", .]
  - name: gcr.io/cloud-builders/docker
    args: [push, "${_IMAGE}"]
  - name: "${_IMAGE}"
    entrypoint: python
    args: [vertex/pipeline.py, compile, --out, /workspace/pipeline.json]
    env: ["GCP_PROJECT=${PROJECT_ID}", "PIPELINE_IMAGE=${_IMAGE}"]
  - name: gcr.io/cloud-builders/gsutil
    args: [cp, /workspace/pipeline.json, "gs://${PROJECT_ID}-fraud/pipeline/pipeline.json"]
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/project-1adf2361-a5bc-4d4a-a7f/fraud/pipeline:v1  # override with --substitutions=_IMAGE=...
timeout: 1800s
options:
  machineType: E2_HIGHCPU_8
