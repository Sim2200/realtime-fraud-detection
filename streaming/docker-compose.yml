# Real-time scoring stack: Kafka (KRaft, no ZooKeeper) and a Spark Structured
# Streaming job that scores each transaction with the exported ONNX model.
#   make stream-up      build + start      Spark UI: http://localhost:4040 (while the job runs)
#   make stream         run the experiment (producer -> Spark -> alerts topic + Parquet sink)
#   make stream-down    stop and remove volumes
name: fraud-streaming

services:
  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_LOG_RETENTION_HOURS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  spark:
    build: {context: ., dockerfile: spark.Dockerfile}
    image: fraud-spark
    # Local-mode Spark with 4 cores; the job is submitted by run_experiment.py with `docker compose exec`.
    command: ["sleep", "infinity"]
    ports: ["4040:4040"]
    cpus: 4
    mem_limit: 3g
    volumes:
      - ./jobs:/opt/jobs:ro
      - ../results/artifacts:/opt/model:ro
      - ./out:/opt/out
    depends_on:
      kafka: {condition: service_healthy}
